<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>still.ly — للبيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background:#ffffff;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Almarai', sans-serif;
    position:relative;
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    z-index:2;
  }

  .domain{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(52px, 11vw, 130px);
    color:#111111;
    letter-spacing:-2px;
    line-height:1;
    white-space:nowrap;
  }

  .for-sale{
    font-weight:800;
    font-size:clamp(20px, 3vw, 30px);
    color:#c98a2c;
    letter-spacing:2px;
  }

  /* ===== Arrow row moving only to the left ===== */
  .arrow-track{
    position:relative;
    width:min(80vw, 480px);
    height:34px;
    overflow:hidden;
    margin-top:6px;
  }
  .arrow-track::before,
  .arrow-track::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:40px;
    z-index:2;
    pointer-events:none;
  }
  .arrow-track::before{ left:0; background:linear-gradient(90deg,#fff, rgba(255,255,255,0)); }
  .arrow-track::after{ right:0; background:linear-gradient(270deg,#fff, rgba(255,255,255,0)); }

  .arrow-strip{
    position:absolute;
    top:0; left:0;
    display:flex;
    align-items:center;
    gap:26px;
    animation:slideLeft 3.2s linear infinite;
  }
  .arrow-strip svg{
    width:26px; height:26px;
    flex-shrink:0;
  }
  .arrow-strip svg path{
    stroke:#111111;
  }

  @keyframes slideLeft{
    from{ transform:translateX(0); }
    to{ transform:translateX(-260px); }
  }

  /* ===== WhatsApp contact button ===== */
  .whatsapp-btn{
    margin-top:18px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 30px;
    border-radius:999px;
    background:#25d366;
    color:#06210f;
    font-weight:800;
    font-size:15px;
    text-decoration:none;
    box-shadow:0 10px 26px rgba(37,211,102,.3);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .whatsapp-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 32px rgba(37,211,102,.42);
  }
  .whatsapp-btn svg{ width:20px; height:20px; flex-shrink:0; }

  @media (max-width:420px){
    .domain{ font-size:15vw; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="domain">still.ly</div>
    <div class="for-sale">للبيع</div>

    <div class="arrow-track">
      <div class="arrow-strip" id="arrowStrip"></div>
    </div>

    <a class="whatsapp-btn" id="waBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.85 1h.01a7.95 7.95 0 0 0 5.54-13.58ZM12.06 18.4h-.01a6.6 6.6 0 0 1-3.36-.92l-.24-.14-2.5.65.67-2.43-.16-.25a6.6 6.6 0 0 1 10.3-8.2 6.55 6.55 0 0 1 1.94 4.67 6.62 6.62 0 0 1-6.64 6.62Zm3.62-4.94c-.2-.1-1.17-.58-1.35-.64-.18-.07-.31-.1-.44.1-.13.2-.5.64-.62.77-.11.13-.23.15-.43.05a5.4 5.4 0 0 1-1.6-.99 6 6 0 0 1-1.1-1.37c-.12-.2-.01-.3.09-.4.09-.1.2-.23.3-.35.1-.11.13-.2.2-.33.06-.13.03-.24-.02-.34-.05-.1-.44-1.06-.6-1.45-.16-.38-.32-.33-.44-.33-.11-.01-.24-.01-.37-.01a.72.72 0 0 0-.52.24c-.18.2-.68.66-.68 1.6s.7 1.86.8 2c.1.13 1.37 2.1 3.33 2.94.46.2.83.32 1.11.41.47.15.9.13 1.24.08.38-.06 1.17-.48 1.33-.94.17-.46.17-.85.12-.94-.05-.09-.18-.14-.38-.24Z"/></svg>
      تواصل عبر واتساب
    </a>
  </div>

<script>
  // build a repeating strip of left-pointing arrows (since page is RTL, "left" = ‹)
  const strip = document.getElementById('arrowStrip');
  const arrowSVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
  let html = "";
  for(let i = 0; i < 14; i++){ html += arrowSVG; }
  strip.innerHTML = html;

  // WhatsApp link
  const phone = "218917021437";
  const message = "مرحباً، أنا مهتم بنطاق still.ly المعروض للبيع.";
  document.getElementById('waBtn').href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
</script>

</body>
</html>
